# SwiftLint 설정
# 아키텍처 규칙(R4~R9)의 강제 수단. 규칙의 이유·예외는 docs/architecture/RULES.md 참고.
# 기존 위반은 .swiftlint-baseline.json 에 동결되어 있다 (make lint-baseline 로 재생성). 새 위반만 보고된다.

baseline: .swiftlint-baseline.json

disabled_rules:
  - multiple_closures_with_trailing_closure
  - cyclomatic_complexity

excluded:
  - build
  - DerivedData
  - Frameworks
  - fastlane
  - .claude
  - "3dollar-in-my-pocket-manager/Generated"
  - "**/*.xcodeproj"

# ---- 기본 룰 임계값 ----
line_length: 200

type_body_length:          # R8 — 줄 수는 신호일 뿐. 500 초과는 disable:next + 사유로 예외 (warning 을 생략하면 기본값 250 이 살아나서 같이 적는다)
  warning: 500
  error: 500

function_body_length:
  warning: 100

file_length:               # R8 — 같은 파일 extension 으로 옮겨 type_body_length 를 피하는 우회를 막는다. 800 초과는 disable + 사유
  warning: 800
  error: 800

large_tuple:
  error: 5

force_cast: error          # R9
force_try: error           # R9

type_name:
  min_length: 3
  max_length:
    warning: 40
    error: 50
  allowed_symbols: ["_"]

identifier_name:
  min_length:
    error: 1
  excluded:
    - id
    - URL
  allowed_symbols: ["_"]

trailing_whitespace:
  ignores_empty_lines: true

vertical_whitespace:
  max_empty_lines: 2

# ---- 아키텍처 custom rules (RULES.md 번호와 1:1) ----
# R1~R3 은 모듈 경계 규칙이라 단일 타깃인 이 레포에는 없다 (RULES.md 참고).
custom_rules:

  no_network_outside_repository:            # R4
    name: "R4 서버 호출은 repository 에서만"
    excluded:
      - "3dollar-in-my-pocket-manager/repository/.*"
      - "3dollar-in-my-pocket-manager/Network/.*"
      - "3dollar-in-my-pocket-manager/utils/HTTPUtils\\.swift"
      - "3dollar-in-my-pocket-manager/extensions/(AFDataResponseExtensions|ObserverExtensions)\\.swift"
    regex: "\\.asyncRequest\\(|\\bAF\\.|HTTPUtils\\.defaultSession"
    message: "R4: 서버 호출은 repository/ 의 XxxApi(enum + ApiRequest) + XxxRepository(protocol) + XxxRepositoryImpl 에서만. ViewModel 은 Dependency 로 주입받는다."
    severity: error

  no_rx_reactorkit:                         # R5
    name: "R5 신규 코드에 RxSwift·ReactorKit 금지"
    regex: "^import (RxSwift|RxCocoa|RxRelay|RxDataSources|ReactorKit)\\b"
    message: "R5: 신규 화면은 Combine 기반 ViewModel(BaseViewModel) 로 만든다. RxSwift·ReactorKit 은 기존 코드(베이스라인)에만 남아 있다."
    severity: error

  viewmodel_no_uikit_import:                # R5
    name: "R5 ViewModel 에서 UIKit·SwiftUI import 금지"
    included: ".*ViewModel\\.swift"
    regex: "^import (UIKit|SwiftUI)\\b"
    message: "R5: ViewModel 은 UI 를 모른다. SwiftUI 화면용 ViewModel 은 import Observation 으로 @Observable 만 쓴다. UI 동작은 Route 로 ViewController 에 넘긴다."
    severity: error

  viewmodel_no_uiapplication:               # R5
    name: "R5 ViewModel 에서 UIApplication 금지"
    included: ".*ViewModel\\.swift"
    regex: "UIApplication\\.shared"
    message: "R5: URL 열기 등 UI 동작은 Route(.openURL) 로 ViewController 에서 처리한다."
    severity: error

  viewmodel_inherits_base:                  # R5
    name: "R5 ViewModel 은 BaseViewModel 상속"
    included: ".*ViewModel\\.swift"
    excluded: "3dollar-in-my-pocket-manager/domains/base/.*"
    regex: "class\\s+\\w*ViewModel\\b\\s*(\\{|:(?!\\s*BaseViewModel\\b))"
    message: "R5: ViewModel 은 BaseViewModel 을 상속한다 (cancellables 공통 관리)."
    severity: error

  vc_inherits_base:                         # R6
    name: "R6 ViewController 는 BaseViewController 상속"
    excluded:
      - "3dollar-in-my-pocket-manager/domains/base/.*"
      - "3dollar-in-my-pocket-managerTests/.*"
    regex: "class\\s+\\w+\\s*:\\s*UIViewController\\b"
    message: "R6: ViewController 는 BaseViewController 를 상속한다."
    severity: error

  cell_inherits_base:                       # R6
    name: "R6 Cell 은 Base Cell 상속"
    excluded: "3dollar-in-my-pocket-manager/domains/base/.*"
    regex: "class\\s+\\w+\\s*:\\s*(UICollectionViewCell|UITableViewCell)\\b"
    message: "R6: UICollectionViewCell 은 BaseCollectionViewCell, UITableViewCell 은 BaseTableViewCell 을 상속한다."
    severity: error

  no_register_id:                           # R6
    name: "R6 registerId 금지"
    regex: "static\\s+(let|var)\\s+(registerId|reuseIdentifier)\\b"
    message: "R6: Cell 식별자는 register(_:) / dequeueReusableCell(indexPath:) 확장이 타입명으로 처리한다."
    severity: error

  no_uicolor_literal:                       # R7
    name: "R7 색 리터럴 금지 (UIColor·Color)"
    excluded: "3dollar-in-my-pocket-manager/extensions/(UIColorExtensions|Color\\+)\\.swift"
    # 하드코딩(hex 문자열 리터럴, red/r/white/hue 직접 생성)만 금지. 서버가 내려준 색을 변수로 넘기는 UIColor(hex: value) 는 허용
    regex: "(UI)?Color\\((hex: *)?\"|(UI)?Color\\((red|r|white|hue):"
    message: "R7: 하드코딩 색은 토큰(UIColorExtensions / Color+ 의 .gray100 등)을 사용한다. 새 색은 두 파일에 토큰부터 추가한다. (서버 색 변수는 허용)"
    severity: error

  no_new_uikit_view:                        # R7
    name: "R7 새 화면·뷰는 SwiftUI"
    excluded:
      - "3dollar-in-my-pocket-manager/domains/base/.*"
      - "3dollar-in-my-pocket-managerTests/.*"
    regex: "class\\s+\\w+\\s*:\\s*(UIView|BaseView|UICollectionViewCell|BaseCollectionViewCell|UITableViewCell|BaseTableViewCell|UICollectionReusableView|UIControl|UIButton|UILabel|UIStackView|UIScrollView|UITextField|UITextView|UIImageView)\\b"
    message: "R7: 새 뷰는 SwiftUI View(struct) 로 만든다. UIKit 이 꼭 필요하면(지도·PanModal·SwiftUI 미지원 API) // swiftlint:disable:next no_new_uikit_view - {사유}. 기존 SwiftUI 에서 UIKit 컴포넌트가 필요하면 UIViewRepresentable 로 감싼다."
    severity: error

  no_new_view_controller:                   # R7
    name: "R7 새 화면 전환은 NavigationStack (VC 금지)"
    excluded:
      - "3dollar-in-my-pocket-manager/domains/base/.*"
      - "3dollar-in-my-pocket-managerTests/.*"
    regex: "class\\s+\\w+\\s*:\\s*(UIViewController|BaseViewController|UIHostingController|UINavigationController|UITabBarController|UIPageViewController)\\b"
    message: "R7: 새 화면은 SwiftUI View, 전환은 NavigationStack·sheet·fullScreenCover 로 한다. 기존 UIKit 화면에서 진입할 때는 UIHostingController(rootView:) 인스턴스로 감싸면 되고 서브클래스는 필요 없다. 기존 코드 때문에 꼭 필요하면 // swiftlint:disable:next no_new_view_controller - {사유}"
    severity: error

  uikit_disable_reason:                     # R7
    name: "R7 UIKit 예외는 사유 필수"
    regex: "swiftlint:disable(:next|:this|:previous)?\\s+(no_new_uikit_view|no_new_view_controller)\\s*$"
    match_kinds: comment
    message: "R7: UIKit 예외(뷰·VC)는 SwiftUI 로 안 되는 이유를 적는다. 예) // swiftlint:disable:next no_new_view_controller - PanModalPresentable 이 UIViewController 를 요구"
    severity: error

  snapkit_leading_trailing:                 # R7
    name: "R7 SnapKit left/right 금지"
    regex: "(\\$0|make)\\.([a-zA-Z]+\\.)*(left|right)\\b"
    message: "R7: SnapKit 제약은 left/right 대신 leading/trailing 을 사용한다. 물리적 방향이 필요하면 disable:next + 이유 주석."
    severity: error

  no_then:                                  # R7
    name: "R7 then 금지"
    regex: "^import Then\\b|\\.then\\s*\\{"
    message: "R7: then 대신 클로저 초기화를 사용한다 (let v: UILabel = { ... }())."
    severity: error

  length_disable_reason:                    # R8
    name: "R8 길이 예외는 사유 필수"
    regex: "swiftlint:disable(:next|:this|:previous)?\\s+(type_body_length|file_length)\\s*$"
    match_kinds: comment
    message: "R8: 길이 예외(type_body_length 500 / file_length 800)는 책임이 하나인 이유를 적는다. 예) // swiftlint:disable:next type_body_length - 셀 레이아웃만 담당"
    severity: error

  no_print:                                 # R9
    name: "R9 print 금지"
    excluded: "3dollar-in-my-pocket-manager/utils/NetworkActivityLogger\\.swift"
    regex: "(^|[^.\\w])print\\("
    message: "R9: print 대신 LogManager(이벤트) 또는 OSLog Logger(디버그)를 사용한다."
    severity: error

reporter: "xcode"
