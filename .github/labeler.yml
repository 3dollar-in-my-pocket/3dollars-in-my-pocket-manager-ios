# 경로 기반 라벨 (actions/labeler v5). 검증 장치를 건드리는 PR을 결정론적으로 표시한다.
# 규칙: docs/process/verification-change.md

verification-change:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/labeler.yml"
          - ".github/PULL_REQUEST_TEMPLATE.md"
          - ".swiftlint.yml"
          - ".swiftlint-baseline.json"
          - "scripts/**"
          - "makefile"
          - "ci_scripts/**"
          - "fastlane/**"
          - "**/*.xcscheme"
          - "3dollar-in-my-pocket-managerTests/**"
          - "docs/architecture/RULES.md"
          - "docs/process/**"
          - "CLAUDE.md"

baseline-change:
  - changed-files:
      - any-glob-to-any-file:
          - ".swiftlint-baseline.json"
